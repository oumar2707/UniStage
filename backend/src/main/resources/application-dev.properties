# Profil de Développement (dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Secret JWT de développement factice (au moins 32 octets / 256 bits)
jwt.secret=DevOnlyJwtSecretKeyForLocalDevelopmentDoNotUseInProdMin32Bytes!
jwt.expirationMs=86400000

# Console H2 (disponible uniquement en dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mots de passe de démo pour DataInitializer
app.demo.admin-password=AdminDev123!
app.demo.etudiant-password=EtudiantDev123!
app.demo.entreprise-password=EntrepriseDev123!

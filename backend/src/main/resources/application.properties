server.port=8080

# Source de données MySQL (Base de données UniStage)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/UniStage?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fallback H2 si MySQL n'est pas accessible lors des tests locaux
# spring.datasource.url=jdbc:h2:mem:UniStage;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driverClassName=org.h2.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Clé secrète JWT & Expiration (24h en millisecondes)
jwt.secret=UniStageSecretKeyForJwtAuthenticationTokenSigningUniversityOfLabe2026SuperSecureKeyWithMin256Bits
jwt.expirationMs=86400000

# Limites d'upload pour les CVs et fichiers
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


server.port=${PORT:8080}

# Base de données
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/unistage}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:unistage}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Nécessaire : les DTO sont construits à partir de collections LAZY
spring.jpa.open-in-view=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# CORS (plusieurs origines séparées par des virgules)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Compte administrateur initial (optionnel)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Upload des CV
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
